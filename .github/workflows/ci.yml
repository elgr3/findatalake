name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:

  # ─── Job 1: Lint ───────────────────────────────────────────────────────────

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install black flake8

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with Flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --exclude=.git,__pycache__,.env

  # ─── Job 2: Test ───────────────────────────────────────────────────────────

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    env:
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=test;AccountKey=dGVzdA==;EndpointSuffix=core.windows.net"
      AZURE_CONTAINER_RAW: raw
      AZURE_CONTAINER_STAGING: staging
      AZURE_CONTAINER_MODELS: models
      ALPHA_VANTAGE_KEY: test_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ─── Job 3: Docker Build ───────────────────────────────────────────────────

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t findatalake-api:latest .

      - name: Verify image was built
        run: docker images findatalake-api
