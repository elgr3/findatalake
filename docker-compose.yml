version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
    AZURE_CONTAINER_RAW: ${AZURE_CONTAINER_RAW}
    AZURE_CONTAINER_STAGING: ${AZURE_CONTAINER_STAGING}
    AZURE_CONTAINER_MODELS: ${AZURE_CONTAINER_MODELS}
    ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./:/opt/airflow/project
  networks:
    - findatalake-network

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - findatalake-network

  # ─── Airflow ───────────────────────────────────────────────────────────────

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@findatalake.com
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy

  # ─── Application ───────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_CONTAINER_RAW: ${AZURE_CONTAINER_RAW}
      AZURE_CONTAINER_STAGING: ${AZURE_CONTAINER_STAGING}
      AZURE_CONTAINER_MODELS: ${AZURE_CONTAINER_MODELS}
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY}
      FINDATALAKE_API_URL: ${FINDATALAKE_API_URL:-http://api:8000}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      airflow-webserver:
        condition: service_healthy
    networks:
      - findatalake-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_artifacts:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
    networks:
      - findatalake-network

# ─── Volumes & Network ─────────────────────────────────────────────────────

volumes:
  postgres_data:

networks:
  findatalake-network:
    driver: bridge
